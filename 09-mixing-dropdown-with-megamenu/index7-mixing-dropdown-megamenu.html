<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        *::before,
        *::after {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: gray;
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
        }

        li {
            list-style-type: none;
        }

        a {
            text-decoration: none;
        }

        .menu {
            width: 100%;
            height: 70px;
            /* border: 1px solid red; */
            margin: 100px auto;

            >ul {
                width: 100%;
                height: 100%;
                background-color: white;
                display: flex;
                align-items: center;
                justify-content: right;
                position: relative;

                >h2 {
                    margin-right: 650px;
                    color: rgb(140, 193, 193);
                    text-transform: capitalize;
                }

                >.pose {
                    position: relative;
                }

                >li {
                    height: 100%;

                    &:hover {
                        >.dropmenu {
                            opacity: 1;
                        }
                    }

                    /* background-color: yellow; */
                    &:last-of-type {
                        margin-right: 30px;
                    }

                    >a {
                        color: rgba(0, 0, 0, 0.649);
                        text-transform: capitalize;
                        padding: 0 30px;
                        font-size: 15px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        width: 100%;
                        height: 100%;
                        transition: .4s;

                        &:hover {
                            color: rgb(140, 193, 193);
                        }
                    }

                    /* /////////////.dropdown menu.///////////// */
                    >.dropmenu {

                        position: absolute;
                        left: 0;
                        top: 70px;
                        opacity: 0;
                        overflow: hidden;
                        transition: .7s;

                        >li {
                            background-color: rgba(0, 0, 0, .65);
                            height: 45px;
                            width: 170px;


                            >a {
                                display: flex;
                                align-items: center;
                                height: 100%;
                                width: 100%;
                                color: rgba(255, 255, 255, 0.773);
                                padding-left: 15px;
                                text-transform: capitalize;
                                font-size: 17px;
                                transition: .4s;

                                /* border: 1px solid red; */
                                &:hover {
                                    background-color: rgba(0, 0, 0, .6);
                                }

                            }
                        }

                    }

                    &:hover {
                        >.mega {
                            left: 0;
                        }
                    }

                    >.mega {
                        position: absolute;
                        left: -2500px;
                        top: 70px;
                        width: 100%;
                        height: 400px;
                        background-color: rgba(255, 255, 255, 0.688);
                        transition: 1s;

                        >li {
                            width: 100%;
                            height: 100%;

                            >h2 {
                                margin-top: 20px;
                                font-size: 30px;
                                color: grey;
                                text-align: center;
                                text-transform: capitalize;
                            }
                        }
                    }
                }
            }
        }
    </style>
</head>

<body>
    <nav class="menu">
        <ul>
            <h2>mohammad takali</h2>
            <li><a href="">home</a></li>
            <li><a href="">about</a></li>
            <li class="pose"><a href="">blog</a>
                <ul class="dropmenu">
                    <li><a href="">articles</a></li>
                    <li><a href="">tutorials</a></li>
                    <li><a href="">humour</a></li>
                    <li><a href="">gaming</a></li>
                    <li><a href="">music</a></li>
                </ul>
            </li>
            <li><a href="">megamenu</a>
                <ul class="mega">
                    <li>
                        <h2>welcome to my megaMenu</h2>
                    </li>
                </ul>
            </li>
            <li><a href="">forum</a></li>
            <li><a href="">help</a></li>
        </ul>
    </nav>
</body>

</html>
