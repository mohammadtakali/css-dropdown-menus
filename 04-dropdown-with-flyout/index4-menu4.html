<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        *::before,
        *::after {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: gray;
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
        }

        li {
            list-style-type: none;
        }

        a {
            text-decoration: none;
        }

        .menu {
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: center;
            margin-top: 100px;

            >ul {
                width: 80%;
                height: 100%;
                /* border: 1px solid red; */
                background-color: #23364B;
                display: flex;

                >li {
                    &:hover {
                        >.dropmenu {
                            opacity: 1;
                            visibility: visible;
                        }
                    }

                    position: relative;

                    /* border: 1px solid black; */
                    &:first-of-type {
                        >a {
                            background-color: #009FE1;
                        }
                    }

                    &:last-of-type {
                        >a {
                            border-right: none;
                        }
                    }

                    >a {
                        width: 100%;
                        height: 100%;
                        /* background-color: red; */
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        padding: 0 25px;
                        color: white;
                        font-size: 15px;
                        text-transform: uppercase;
                        border-right: 1px solid rgba(255, 255, 255, 0.248);
                        transition: .4s;

                        &:hover {
                            background-color: #009FE1;
                        }

                    }

                    /* //////////////.dropdown menu.////////////// */
                    >.dropmenu {
                        position: absolute;
                        width: 220px;
                        background-color: #415b79;
                        opacity: 0;
                        visibility: hidden;
                        transition: .4s;


                        >li {
                            width: 100%;
                            height: 50px;
                            position: relative;

                            /* border: 1px solid red; */
                            &:last-of-type {
                                >a {
                                    border-bottom: none;
                                }
                            }


                            >a {
                                display: flex;
                                align-items: center;
                                width: 100%;
                                height: 100%;
                                color: white;
                                font-size: 15px;
                                text-transform: capitalize;
                                padding-left: 10px;
                                border-bottom: 1px solid rgba(255, 255, 255, 0.248);

                                transition: .4s;

                                &:hover {
                                    background-color: #009FE1;
                                }

                            }

                            &:hover {
                                >.rightflyout {
                                    width: 200px;
                                }
                            }

                            >.rightflyout {
                                position: absolute;
                                top: 0;
                                left: 100%;
                                /* border: 1px solid black; */
                                width: 0;
                                overflow: hidden;
                                transition: 1s;

                                >li {
                                    background-color: #517094;
                                    height: 50px;

                                    /* border: 1px solid red; */
                                    &:last-of-type {
                                        border-bottom: none;
                                    }

                                    >a {
                                        /* background-color: yellow; */
                                        display: flex;
                                        height: 100%;
                                        width: 100%;
                                        color: white;
                                        font-size: 15px;
                                        text-transform: capitalize;
                                        align-items: center;
                                        padding-left: 10px;
                                        border-bottom: 1px solid rgba(255, 255, 255, 0.248);
                                        transition: .4s;

                                        &:hover {
                                            background-color: #009FE1;
                                        }
                                    }

                                }
                            }
                        }
                    }
                }
            }
        }
    </style>
</head>

<body>
    <nav class="menu">
        <ul>
            <li><a href="">home</a></li>
            <li><a href="">flyout</a>
                <ul class="dropmenu">
                    <li><a href="">flyout left</a></li>
                    <li><a href="">flyout right</a>
                        <ul class="rightflyout">
                            <li><a href="">mobile</a></li>
                            <li><a href="">computer</a></li>
                            <li><a href="">watch</a></li>
                        </ul>
                    </li>
                    <li><a href="">no flyout</a></li>
                </ul>
            </li>
            <li><a href="">services</a></li>
            <li><a href="">portfolio</a></li>
            <li><a href="">megamenu</a></li>
            <li><a href="">images</a>
                <ul class="dropmenu">
                    <li><a href="">All Images</a></li>
                    <li><a href="">Photography</a></li>
                    <li><a href="">Project Photos</a></li>
                    <li><a href="">Event Gallery</a></li>
                </ul>
            </li>
            <li><a href="">blog</a></li>
        </ul>
    </nav>
</body>

</html>
