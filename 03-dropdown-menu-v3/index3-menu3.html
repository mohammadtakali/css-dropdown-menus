<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        *::before,
        *::after {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: rgba(255, 255, 255, 1);
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
        }

        li {
            list-style-type: none;
        }

        a {
            text-decoration: none;
        }

        .menu {
            width: 100%;
            height: 75px;
            /* background-color: yellowgreen; */
            margin-top: 130px;
            position: relative;
            display: flex;
            justify-content: center;

            >h2 {
                position: absolute;
                bottom: 120px;
                /* left: 45%; */

            }

            >ul {
                width: 80%;
                height: 100%;
                display: flex;
                background-color: #23364B;
                /* border: 1px solid red; */

                >li {
                    position: relative;

                    &:hover {
                        >.dropmenu {
                            height: 420px;
                        }
                    }

                    &:first-of-type {
                        background-color: #009FE1;
                    }

                    /* border: 1px solid yellow; */
                    &:last-of-type {
                        >a {
                            border-right: none;
                        }
                    }

                    >a {
                        /* background-color: red; */
                        display: flex;
                        height: 100%;
                        /* justify-content: center; */
                        align-items: center;
                        padding: 30px;
                        border-right: 1px dotted rgba(255, 255, 255, 0.575);
                        color: rgba(255, 255, 255, 0.777);
                        font-size: 17px;
                        text-transform: uppercase;
                        transition: .4s;

                        &:hover {
                            background-color: #009FE1;
                        }
                    }

                    /* //////////////.Dropdown Menu.//////////////*/
                    >.dropmenu {
                        background-color: #334b66;
                        /* border: 1px solid black; */
                        position: absolute;
                        left: 0;
                        height: 0;
                        transition: 1s;
                        width: 250px;
                        top: 75px;

                        >li {
                            /* border: 1px solid red; */
                            height: 70px;
                            display: flex;
                            align-items: center;


                            &:last-of-type {
                                >a {
                                    border-bottom: none;
                                }
                            }

                            >a {
                                /* background-color: red; */
                                display: flex;
                                align-items: center;
                                height: 100%;
                                width: 100%;
                                padding-left: 15px;
                                color: rgba(255, 255, 255, 0.777);
                                border-bottom: 1px dotted rgba(255, 255, 255, 0.575);
                                transition: .4s;
                                text-transform: capitalize;

                                &:hover {
                                    background-color: #009FE1;
                                }
                            }
                        }
                    }
                }

            }
        }
    </style>
</head>

<body>
    <nav class="menu">
        <h2>my profile</h2>
        <ul>
            <li><a href="">home</a></li>
            <li><a href="">flyout</a></li>
            <li><a href="">services</a>
                <ul class="dropmenu">
                    <li><a href="">subservices</a></li>
                    <li><a href="">subservices</a></li>
                    <li><a href="">subservices</a></li>
                    <li><a href="">subservices</a></li>
                    <li><a href="">subservices</a></li>
                    <li><a href="">subservices</a></li>
                </ul>
            </li>
            <li><a href="">porfolio</a></li>
            <li><a href="">megamenu</a></li>
            <li><a href="">images</a>
                <ul class="dropmenu">
                    <li><a href="">subimages</a></li>
                    <li><a href="">subimages</a></li>
                    <li><a href="">subimages</a></li>
                    <li><a href="">subimages</a></li>
                    <li><a href="">subimages</a></li>
                    <li><a href="">subimages</a></li>
                </ul>
            </li>
            <li><a href="">blog</a></li>
        </ul>
    </nav>
</body>

</html>
